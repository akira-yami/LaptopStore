spring.application.name=LaptopStore

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:laptop_store}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f4c8b2d0e9f1a7b3c5d8e2f4a6b0c1d3e5f7a9b2c4d6e8f0a}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXP_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXP_MS:604800000}
app.jwt.refresh-cookie-name=refresh_token

app.ai.enabled=${AI_ENABLED:false}
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.api-key=${AI_API_KEY:mock-key}
app.ai.model=${AI_MODEL:gemini-1.5-flash}
app.ai.timeout-ms=${AI_TIMEOUT_MS:10000}

vnpay.tmn-code=${VNPAY_TMN_CODE:DEMO_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET:DEMO_HASH_SECRET_KEY_FOR_SANDBOX}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8081/api/v1/payments/vnpay/ipn}

spring.config.import=optional:file:.env[.properties]
server.address=0.0.0.0
server.port=${PORT:8081}
server.forward-headers-strategy=framework
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:*}
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
app.order.expire-check-interval-ms=${ORDER_EXPIRE_CHECK_INTERVAL_MS:60000}

# ==============================================================================
# SPRING MAIL CONFIGURATION (Gửi và nhận: stevenndln@gmail.com)
# ==============================================================================
# [TẠI SAO THAY ĐỔI & BẢN CHẤT HẠ TẦNG]:
# - Lý do thay đổi: Cấu hình Spring Boot Starter Mail kết nối SMTP máy chủ Gmail để phục vụ
#   các tác vụ gửi thông báo đơn hàng, xác thực tài khoản và kiểm thử hệ thống.
# - Nếu giữ theo cách cũ (không cấu hình mail):
#   Hệ thống không thể gửi email tự động; các nghiệp vụ xác nhận đơn hoặc reset mật khẩu
#   sẽ phải xử lý thủ công hoặc phụ thuộc dịch vụ ngoài tốn kém.
# - Xử lý theo cách mới được lợi gì:
#   + Tận dụng giao thức SMTP Gmail chuẩn hóa, bảo mật STARTTLS cổng 587.
#   + Cho phép ghi đè thông qua biến môi trường MAIL_USERNAME và MAIL_PASSWORD mà không làm lộ secret.
#   + Cung cấp giá trị mặc định cho địa chỉ gửi và nhận: stevenndln@gmail.com theo đúng yêu cầu bài toán.
# ==============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:stevenndln@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:stevenndln@gmail.com}
app.mail.default-to=${MAIL_DEFAULT_TO:stevenndln@gmail.com}

